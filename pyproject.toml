[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "lbvh2"
version = "0.1.0"
description = "Fast axis-aligned bounding box intersection via linear BVH (self-hosted reimplementation)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "internal" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=7", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the compiled extension with the wheel so `pip install lbvh2-*.whl`
# drops the .so/.pyd alongside the Python wrapper.
"lbvh2" = ["_lbvh2*.so", "_lbvh2*.pyd"]

# Per-Python-version wheels (no abi3). Matches the original `lbvh` package.
# pybind11 has a PYBIND11_BUILD_ABI3 knob, but enabling it would couple us
# to a single Python-ABI generation — per-version wheels are simpler.

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*"]