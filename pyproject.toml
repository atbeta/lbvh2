[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "lbvh2"
version = "0.1.0"
description = "Fast axis-aligned bounding box intersection via linear BVH (self-hosted reimplementation)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "internal" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/lbvh2"]
cmake.args = ["-DCMAKE_BUILD_TYPE=Release"]
sdist.include = ["src/cpp/*.hpp", "src/cpp/*.cpp"]
